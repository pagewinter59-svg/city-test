<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>哪个城市最旺你</title>

<style>

/* =========================================================
   全局
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;

    background:
        radial-gradient(
            circle at 20% 10%,
            rgba(123, 102, 255, 0.16),
            transparent 30%
        ),

        radial-gradient(
            circle at 80% 20%,
            rgba(255, 150, 190, 0.14),
            transparent 28%
        ),

        linear-gradient(
            135deg,
            #faf8ff,
            #f4f6ff 55%,
            #fff8fc
        );

    color: #29283a;

    min-height: 100vh;
}

.container {

    width: min(92%, 760px);

    margin: 0 auto;
}


/* =========================================================
   首页
========================================================= */

#home {

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 40px 0;
}

.hero {

    width: 100%;

    text-align: center;
}

.logo {

    display: inline-block;

    padding: 8px 18px;

    border-radius: 999px;

    background:
        rgba(255,255,255,0.75);

    border:
        1px solid rgba(130,120,180,0.16);

    color: #7669b7;

    font-size: 13px;

    letter-spacing: 2px;

    margin-bottom: 22px;
}

.title {

    font-size:
        clamp(38px, 10vw, 70px);

    line-height: 1.08;

    font-weight: 800;

    background:
        linear-gradient(
            120deg,
            #6156a8,
            #8675d1,
            #ba7ca8
        );

    -webkit-background-clip: text;

    -webkit-text-fill-color: transparent;

    margin-bottom: 18px;
}

.subtitle {

    color: #77748b;

    font-size: 15px;

    line-height: 1.8;

    max-width: 520px;

    margin:
        0 auto 42px;
}


/* =========================================================
   输入框
========================================================= */

.input-card {

    background:
        rgba(255,255,255,0.78);

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);

    border:
        1px solid rgba(255,255,255,0.9);

    box-shadow:
        0 20px 60px
        rgba(83,72,130,0.12);

    border-radius: 28px;

    padding: 30px;

    max-width: 600px;

    margin: auto;
}

.input-title {

    font-size: 18px;

    font-weight: 700;

    margin-bottom: 22px;
}

.date-row {

    display: grid;

    grid-template-columns:
        1.2fr 1fr 1fr;

    gap: 12px;
}

.date-box label {

    display: block;

    font-size: 12px;

    color: #9995aa;

    margin-bottom: 7px;

    text-align: left;
}

.date-box select {

    width: 100%;

    height: 50px;

    border:
        1px solid #e7e3f0;

    border-radius: 14px;

    background: #fff;

    color: #38354b;

    padding: 0 12px;

    font-size: 15px;

    outline: none;

    transition: 0.2s;
}

.date-box select:focus {

    border-color:
        #8b7bd0;

    box-shadow:
        0 0 0 4px
        rgba(139,123,208,0.1);
}


/* =========================================================
   开始按钮
========================================================= */

.start-btn {

    width: 100%;

    height: 56px;

    border: none;

    border-radius: 18px;

    margin-top: 24px;

    color: white;

    font-size: 16px;

    font-weight: 700;

    cursor: pointer;

    background:
        linear-gradient(
            110deg,
            #6658ae,
            #8c79d2,
            #b67aa8
        );

    box-shadow:
        0 12px 28px
        rgba(108,91,175,0.25);

    transition:
        transform 0.2s,
        box-shadow 0.2s;
}

.start-btn:hover {

    transform:
        translateY(-2px);

    box-shadow:
        0 16px 34px
        rgba(108,91,175,0.3);
}

.start-btn:active {

    transform:
        translateY(0);
}

.tip {

    font-size: 12px;

    color: #aaa6b7;

    margin-top: 15px;
}


/* =========================================================
   加载页面
========================================================= */

#loading {

    display: none;

    min-height: 100vh;

    align-items: center;

    justify-content: center;

    padding: 30px;
}

.loading-card {

    width: min(90%, 460px);

    background:
        rgba(255,255,255,0.82);

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);

    border:
        1px solid
        rgba(255,255,255,0.9);

    box-shadow:
        0 20px 60px
        rgba(83,72,130,0.12);

    border-radius: 30px;

    padding: 45px 30px;

    text-align: center;
}
